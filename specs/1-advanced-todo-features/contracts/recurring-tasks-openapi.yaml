openapi: 3.0.3
info:
  title: Recurring Tasks API
  description: API for managing recurring tasks in the Todo application
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Development server
paths:
  /users/me/tasks:
    post:
      summary: Create a new task (with optional recurring configuration)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
  /users/me/tasks/{task_id}/complete:
    put:
      summary: Complete a task and create next occurrence if recurring
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  recurring_created:
                    type: boolean
        '401':
          description: Unauthorized
        '404':
          description: Task not found
  /users/me/recurring-tasks:
    get:
      summary: Get all recurring task series for the user
      responses:
        '200':
          description: List of recurring task series
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecurringTaskSeriesResponse'
        '401':
          description: Unauthorized
components:
  schemas:
    CreateTaskRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          description: Task title
          maxLength: 255
        description:
          type: string
          description: Task description
        due_date:
          type: string
          format: date-time
          description: Due date and time
        is_recurring:
          type: boolean
          description: Whether this task is recurring
          default: false
        frequency:
          type: string
          enum: [daily, weekly, monthly, custom]
          description: Recurrence frequency
        recurrence_end_date:
          type: string
          format: date-time
          description: End date for recurrence
        recurrence_pattern:
          type: object
          description: Complex recurrence pattern (for custom frequency)
        reminder_enabled:
          type: boolean
          description: Whether to send reminders
          default: true
        reminder_timing:
          type: string
          enum: [15min, 1hr, 1day]
          description: When to send reminder
          default: 1hr
        priority:
          type: string
          enum: [low, medium, high]
          description: Task priority
          default: medium
    TaskResponse:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        completed:
          type: boolean
        due_date:
          type: string
          format: date-time
        priority:
          type: string
          enum: [low, medium, high]
        is_recurring:
          type: boolean
        frequency:
          type: string
          enum: [daily, weekly, monthly, custom]
        recurrence_end_date:
          type: string
          format: date-time
        parent_task_id:
          type: integer
        reminder_enabled:
          type: boolean
        reminder_timing:
          type: string
          enum: [15min, 1hr, 1day]
        reminder_sent:
          type: boolean
        timezone:
          type: string
        user_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RecurringTaskSeriesResponse:
      type: object
      properties:
        id:
          type: integer
        original_task_id:
          type: integer
        title:
          type: string
        frequency:
          type: string
          enum: [daily, weekly, monthly, custom]
        recurrence_end_date:
          type: string
          format: date-time
        total_instances:
          type: integer
        active_instances:
          type: integer