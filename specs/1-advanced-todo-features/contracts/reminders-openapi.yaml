openapi: 3.0.3
info:
  title: Reminders API
  description: API for managing task reminders in the Todo application
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Development server
paths:
  /users/me/reminders:
    get:
      summary: Get all upcoming reminders for the user
      responses:
        '200':
          description: List of upcoming reminders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReminderResponse'
        '401':
          description: Unauthorized
  /users/me/reminders/{task_id}:
    put:
      summary: Update reminder settings for a specific task
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReminderRequest'
      responses:
        '200':
          description: Reminder settings updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderResponse'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '404':
          description: Task not found
  /users/me/reminders/{task_id}/dismiss:
    post:
      summary: Dismiss a specific reminder
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Reminder dismissed successfully
        '401':
          description: Unauthorized
        '404':
          description: Task or reminder not found
components:
  schemas:
    UpdateReminderRequest:
      type: object
      properties:
        reminder_enabled:
          type: boolean
          description: Whether to send reminders
        reminder_timing:
          type: string
          enum: [15min, 1hr, 1day]
          description: When to send reminder
    ReminderResponse:
      type: object
      properties:
        task_id:
          type: integer
        title:
          type: string
        due_date:
          type: string
          format: date-time
        time_until_due_minutes:
          type: integer
        priority:
          type: string
          enum: [low, medium, high]
        reminder_enabled:
          type: boolean
        reminder_timing:
          type: string
          enum: [15min, 1hr, 1day]
        reminder_sent:
          type: boolean
        reminder_type:
          type: string
          enum: [REMINDER_DUE_15MIN, REMINDER_DUE_1HR, REMINDER_DUE_1DAY, REMINDER_OVERDUE]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ReminderEvent:
      type: object
      properties:
        event_type:
          type: string
          enum: [REMINDER_DUE_15MIN, REMINDER_DUE_1HR, REMINDER_DUE_1DAY, REMINDER_OVERDUE]
        task_id:
          type: integer
        user_id:
          type: integer
        title:
          type: string
        due_date:
          type: string
          format: date-time
        time_until_due_minutes:
          type: integer
        priority:
          type: string
          enum: [low, medium, high]
        timestamp:
          type: string
          format: date-time