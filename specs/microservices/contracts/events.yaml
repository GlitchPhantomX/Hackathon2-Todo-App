# Dapr Event Contracts: Advanced Task Logic & Notification Services

## Overview

This document defines the event contracts used by the recurring task and notification services. These events are published and consumed through Dapr's pub/sub mechanism.

## Event Definitions

### Task Events

#### Task Completed Event
**Topic**: `task-events`
**Event Type**: `task-completed`

```json
{
  "eventId": "string (unique event identifier)",
  "eventType": "task-completed",
  "source": "/tasks/{taskId}",
  "data": {
    "taskId": "integer (ID of the completed task)",
    "userId": "integer (ID of the user who owns the task)",
    "title": "string (task title)",
    "recurrencePattern": "string (one of: 'daily', 'weekly', 'monthly', null)",
    "dueDate": "string (ISO 8601 datetime)",
    "completedAt": "string (ISO 8601 datetime)",
    "originalDueDate": "string (ISO 8601 datetime, original due date before completion)"
  },
  "dataContentType": "application/json",
  "pubsubname": "pubsub",
  "traceid": "string (trace ID for distributed tracing)",
  "tracedate": "string (timestamp of event publication)"
}
```

#### Expected Response from Recurring Service
The recurring service processes this event and may publish a new event:
- **Event Type**: `task-created`
- **Topic**: `task-events`

### Notification Events

#### Reminder Sent Event
**Topic**: `notifications`
**Event Type**: `reminder-sent`

```json
{
  "eventId": "string (unique event identifier)",
  "eventType": "reminder-sent",
  "source": "/notifications",
  "data": {
    "taskId": "integer (ID of the task with approaching due date)",
    "userId": "integer (ID of the user who owns the task)",
    "taskTitle": "string (title of the task)",
    "dueDateTime": "string (ISO 8601 datetime when task is due)",
    "reminderTime": "string (ISO 8601 datetime when reminder was sent)",
    "timeUntilDueMinutes": "integer (minutes until task is due)",
    "message": "string (reminder message content)"
  },
  "dataContentType": "application/json",
  "pubsubname": "pubsub",
  "traceid": "string (trace ID for distributed tracing)",
  "tracedate": "string (timestamp of event publication)"
}
```

## Service Endpoints

### Recurring Task Service

#### Health Check Endpoint
```
GET /health
```

**Response**:
```json
{
  "status": "healthy",
  "timestamp": "2026-01-14T10:00:00Z",
  "service": "recurring-task-service",
  "version": "1.0.0"
}
```

#### Process Task Event Endpoint
```
POST /events/process
```

**Request Body**:
```json
{
  "event": {
    "eventId": "string",
    "eventType": "task-completed",
    "data": {}
  }
}
```

**Response**:
```json
{
  "status": "processed",
  "processedEventId": "string",
  "newTaskId": "integer (if a new task was created)",
  "message": "string (processing result message)"
}
```

### Notification Service

#### Health Check Endpoint
```
GET /health
```

**Response**:
```json
{
  "status": "healthy",
  "timestamp": "2026-01-14T10:00:00Z",
  "service": "notification-service",
  "version": "1.0.0"
}
```

#### Scan and Notify Endpoint
```
POST /notifications/scan-and-send
```

**Request Body**:
```json
{
  "scanWindowMinutes": "integer (time window to scan for upcoming tasks)"
}
```

**Response**:
```json
{
  "status": "completed",
  "scannedTasksCount": "integer",
  "notificationsSent": "integer",
  "timestamp": "string (ISO 8601 datetime)"
}
```

## Dapr Component Configurations

### Pub/Sub Component Contract
The services expect a pub/sub component named `pubsub` with the following topics:
- `task-events`: For task lifecycle events
- `notifications`: For notification events

### State Store Contract
The services expect a state store component named `statestore` for:
- Tracking processed events (idempotency)
- Storing service state between restarts

## Error Handling

### Standard Error Response
All services return errors in the following format:

```json
{
  "error": {
    "code": "string (error code)",
    "message": "string (human-readable error message)",
    "details": "string or object (additional error details)",
    "timestamp": "string (ISO 8601 datetime)"
  }
}
```

### Common Error Codes
- `EVENT_PROCESSING_FAILED`: Failed to process an incoming event
- `TASK_CREATION_FAILED`: Failed to create a new recurring task
- `DATABASE_CONNECTION_ERROR`: Unable to connect to database
- `INVALID_RECIPIENT`: Notification recipient is invalid
- `DUPLICATE_EVENT`: Event has already been processed (idempotency check)